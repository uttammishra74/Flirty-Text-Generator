<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Page not found - Flirty Text Generator. The page you're looking for doesn't exist or has been moved.">
    <meta name="robots" content="noindex, follow">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="404 - Page Not Found | Flirty Text Generator">
    <meta property="og:description" content="The page you're looking for doesn't exist or has been moved.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://flirtytextgenerator.com/404.html">
    
    <title>404 - Page Not Found | Flirty Text Generator</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="public/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="public/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="96x96" href="public/favicon-96x96.png">
    <link rel="manifest" href="public/site.webmanifest">
    
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--background-color) 0%, var(--surface-color) 100%);
            padding: var(--spacing-md);
        }
        
        .error-content {
            text-align: center;
            max-width: 600px;
        }
        
        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: var(--spacing-md);
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        .error-title {
            font-size: var(--font-size-xl);
            color: var(--text-color);
            margin-bottom: var(--spacing-sm);
        }
        
        .error-message {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-lg);
            line-height: 1.6;
        }
        
        .error-actions {
            display: flex;
            gap: var(--spacing-md);
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: var(--radius-md);
            font-weight: 600;
            text-decoration: none;
            transition: all var(--transition-fast);
        }
        
        .error-btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        
        .error-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }
        
        .error-btn-secondary {
            background: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }
        
        .error-btn-secondary:hover {
            background: var(--border-color);
        }
        
        .broken-heart {
            font-size: 60px;
            margin-bottom: var(--spacing-md);
            animation: heartbreak 2s ease-in-out infinite;
        }
        
        @keyframes heartbreak {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <div class="broken-heart">💔</div>
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">
                Oops! The page you're looking for seems to have ghosted us. 
                It might have been moved, deleted, or never existed in the first place.
            </p>
            <div class="error-actions">
                <a href="index.html" class="error-btn error-btn-primary">
                    <i class="fas fa-home"></i> Go Home
                </a>
                <a href="flirty-text.html" class="error-btn error-btn-secondary">
                    <i class="fas fa-heart"></i> Try the Generator
                </a>
            </div>
        </div>
    </div>
    
    <script>
        // Redirect to home page after 10 seconds
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 10000);
    </script>
</body>
</html>
